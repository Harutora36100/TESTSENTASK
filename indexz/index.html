<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>แบบทดสอบข้อมูลส่วนตัว</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-gradient-to-br from-pink-100 via-purple-50 to-rose-100 font-sans overflow-x-hidden">
  <main class="flex items-center justify-center p-4 min-h-screen">
    <div class="form-container w-full max-w-2xl mx-auto rounded-3xl shadow-2xl border border-pink-200 p-8 md:p-12 backdrop-blur-md bg-white/90">
      <header class="text-center mb-6 md:mb-8">
        <h1 class="text-3xl md:text-4xl font-bold text-pink-600 mb-2">แบบแสกนผ่านด่าน</h1>
        <p class="text-gray-600 text-lg">ตอบคำถามให้ถูกต้องเพื่อผ่านด่าน!</p>
      </header>

      <form id="quizForm" class="space-y-6">
        <!-- ตัวอย่างคำถาม -->
        <div class="bg-white rounded-2xl p-6 border-l-4 border-pink-400">
          <label class="block text-lg font-semibold text-gray-700 mb-3">
            1. เราครบกันวันที่อะไร?
          </label>
          <select name="q1" required class="w-full px-4 py-3 border-2 border-pink-200 rounded-xl focus:border-pink-400 outline-none transition">
            <option value="">เลือกคำตอบ</option>
            <option value="09/08/69">09/08/69</option>
            <option value="09/06/67">09/06/67</option>
            <option value="08/06/67">08/06/67</option>
            <option value="09/09/67">09/09/67</option>
          </select>
        </div>
                       <!-- Question 2 -->
                    <div class="question-card bg-white rounded-xl md:rounded-2xl p-4 md:p-6 border-l-4 border-purple-400">
                        <label class="block text-base md:text-lg font-semibold text-gray-700 mb-2 md:mb-3">
                            2. แฟนตัวเองเกิดวันที่เท่าไหร่เดือนอะไรปีอะไร?
                        </label>
                        <select name="q2" class="w-full px-3 md:px-4 py-2 md:py-3 border-2 border-purple-200 rounded-lg md:rounded-xl focus:border-purple-400 focus:outline-none transition-colors text-gray-700 text-base" required>
                            <option value="">เลือกคำตอบ</option>
                            <option value="26/03/50">26/03/50</option>
                            <option value="06/03/50">06/03/50</option>
                            <option value="16/03/50">16/03/50</option>
                            <option value="08/03/50">08/03/50</option>
                        </select>
                    </div>

                    <!-- Question 3 -->
                    <div class="question-card bg-white rounded-xl md:rounded-2xl p-4 md:p-6 border-l-4 border-rose-400">
                        <label class="block text-base md:text-lg font-semibold text-gray-700 mb-2 md:mb-3">
                            3. อาหารที่แฟนตัวเองชอบกินที่สุดคือ?
                        </label>
                        <select name="q3" class="w-full px-3 md:px-4 py-2 md:py-3 border-2 border-rose-200 rounded-lg md:rounded-xl focus:border-rose-400 focus:outline-none transition-colors text-gray-700 text-base" required>
                            <option value="">เลือกคำตอบ</option>
                            <option value="กะเพรา">กะเพรา</option>
                            <option value="ข้าวมันไก่">ข้าวมันไก่</option>
                            <option value="มาม่า">มาม่า</option>
                            <option value="ก๋วยเตี๋ยว">ก๋วยเตี๋ยว</option>
                        </select>
                    </div>

                    <!-- Question 4 -->
                    <div class="question-card bg-white rounded-xl md:rounded-2xl p-4 md:p-6 border-l-4 border-pink-400">
                        <label class="block text-base md:text-lg font-semibold text-gray-700 mb-2 md:mb-3">
                            4. ตอนนี้เจมส์มีแฟนเป็นใคร?
                        </label>
                        <select name="q4" class="w-full px-3 md:px-4 py-2 md:py-3 border-2 border-pink-200 rounded-lg md:rounded-xl focus:border-pink-400 focus:outline-none transition-colors text-gray-700 text-base" required>
                            <option value="">เลือกคำตอบ</option>
                            <option value="ไม่มีแฟน">ไม่มีแฟน</option>
                            <option value="นุ้งนิ้ง">นุ้งนิ้ง</option>
                            <option value="คนเก่า">คนเก่า</option>
                            <option value="ไม่รู้">ไม่รู้</option>
                        </select>
                    </div>

                    <!-- Question 5 -->
                    <div class="question-card bg-white rounded-xl md:rounded-2xl p-4 md:p-6 border-l-4 border-purple-400">
                        <label class="block text-base md:text-lg font-semibold text-gray-700 mb-2 md:mb-3">
                            5. คิดว่าแฟนชอบอะไรในตัวเรามากที่สุด?
                        </label>
                        <select name="q5" class="w-full px-3 md:px-4 py-2 md:py-3 border-2 border-purple-200 rounded-lg md:rounded-xl focus:border-purple-400 focus:outline-none transition-colors text-gray-700 text-base" required>
                            <option value="">เลือกคำตอบ</option>
                            <option value="หมี">หมี</option>
                            <option value="นม">นม</option>
                            <option value="หน้าตา">หน้าตา</option>
                            <option value="หัวใจ">หัวใจ</option>
                        </select>
                    </div>

        <!-- เพิ่มคำถามอื่นๆ ได้ตามโค้ดเดิม -->
        <!-- ... -->

        <div class="text-center pt-6">
          <button type="submit"
            class="bg-gradient-to-r from-pink-400 to-purple-500 hover:from-pink-500 hover:to-purple-600 text-white font-bold py-3 px-10 rounded-full shadow-lg hover:shadow-xl transform hover:scale-105 transition-all">
            พร้อมส่งคำตอบยัง 🎯
          </button>
        </div>
      </form>

      <div id="errorMessage" class="hidden mt-6 p-4 bg-red-100 border-l-4 border-red-400 rounded-xl text-red-700">
        ❌ กรุณาลองตั้งใจทำใหม่อีกครั้ง!
      </div>
    </div>
  </main>

  <script>
    const correctAnswers = {
      q1: '09/06/67',
      q2: '26/03/50',
      q3: 'ก๋วยเตี๋ยว',
      q4: 'นุ้งนิ้ง',
      q5: 'หมี'
    };

    document.getElementById('quizForm').addEventListener('submit', function (e) {
      e.preventDefault();
      const formData = new FormData(this);
      let allCorrect = true;

      for (let [key, value] of Object.entries(correctAnswers)) {
        if (formData.get(key) !== value) {
          allCorrect = false;
          break;
        }
      }

      if (allCorrect) {
        window.location.href = "index2.html"; // ไปหน้าผ่านด่าน
      } else {
        const err = document.getElementById('errorMessage');
        err.classList.remove('hidden');
        setTimeout(() => err.classList.add('hidden'), 3000);
      }
    });
  </script>
</body>
</html>
