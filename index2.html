<div id="hearts-container" class="fixed inset-0 -z-10 overflow-hidden"></div>

<script>
  const container = document.getElementById("hearts-container");

  function createHeart() {
    const heart = document.createElement("span");
    heart.textContent = "💖";
    heart.className = "absolute text-pink-400 text-2xl select-none";
    
    // สุ่มตำแหน่งและขนาดหัวใจ
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = Math.random() * 24 + 16 + "px";
    
    // เริ่มลอยจากล่างจอ
    heart.style.bottom = "-20px";
    
    // เพิ่มเข้าใน container
    container.appendChild(heart);
    
    // สุ่มระยะเวลาและการเคลื่อนไหว
    const riseDuration = 4000 + Math.random() * 3000;
    const drift = Math.random() * 50 - 25;

    heart.animate([
      { transform: `translateX(0px) translateY(0px)`, opacity: 1 },
      { transform: `translateX(${drift}px) translateY(-110vh)`, opacity: 0 }
    ], {
      duration: riseDuration,
      easing: "ease-out",
      fill: "forwards"
    });

    // ลบหัวใจเมื่อ animation จบ
    setTimeout(() => {
      heart.remove();
    }, riseDuration);
  }

  // สร้างหัวใจทุก ๆ 300ms
  setInterval(createHeart, 300);
</script>

  <script>
  function startAnniversaryClock() {
    const anniversaryDate = new Date('2024-06-09');

    function updateClock() {
      const now = new Date();
      const diff = now - anniversaryDate;

      const totalDays = Math.floor(diff / (1000 * 60 * 60 * 24));

      // 🩷 คำนวณปีและวัน
      const years = Math.floor(totalDays / 365);
      const days = totalDays % 365;

      const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
      const mins = Math.floor((diff / (1000 * 60)) % 60);
      const secs = Math.floor((diff / 1000) % 60);

      // 🩷 แสดงผลรวมปีด้วย
      document.getElementById('anniversaryClock').textContent =
        `${years} ปี ${days} วัน ${hours} ชั่วโมง ${mins} นาที ${secs} วินาที`;
    }

    updateClock();
    setInterval(updateClock, 1000);
  }

  startAnniversaryClock();
</script>
